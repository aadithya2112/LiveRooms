services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports: ['3001:3000']
    environment:
      PORT: 3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_SIGNALLING_SERVER_URL: ${VITE_SIGNALLING_SERVER_URL:-http://localhost:3001}
    ports: ['5173:5173']
    depends_on: [server]
    restart: unless-stopped
